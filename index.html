<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --nuit: #0b0a14;
    --nuit-2: #1a1430;
    --or: #f2b632;
    --braise: #ff6a2b;
    --foret: #8fb35a;
    --parchemin: #efe6d0;
    --discret: #9a90b8;
    --titre: "Press Start 2P", "Courier New", monospace;
    --texte: "VT323", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--nuit);
    color: var(--parchemin);
    font-family: var(--texte);
    font-size: 22px;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255, 106, 43, .22), transparent 70%),
      radial-gradient(ellipse 80% 70% at 50% 0%, var(--nuit-2), var(--nuit) 75%);
  }

  #fond, #scene { position: fixed; inset: 0; }
  #fond { width: 100%; height: 100%; z-index: 0; }
  #scene { z-index: 1; overflow: hidden; }

  /* ── Personnages qui traversent l'écran ── */
  .perso {
    position: absolute;
    left: 0;
    cursor: pointer;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
  }
  .perso.coucou { top: auto; bottom: -1.5%; z-index: 101; }
  .perso.coucou img { animation: none; }
  .perso .saut { display: block; height: 100%; }
  .perso img {
    display: block;
    height: 100%;
    width: auto;
    image-rendering: pixelated;
    pointer-events: none;
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .55));
    animation: trot var(--pas, .7s) ease-in-out infinite alternate;
  }
  @keyframes trot {
    from { transform: scaleX(var(--sens, 1)) translateY(0) rotate(-1.5deg); }
    to   { transform: scaleX(var(--sens, 1)) translateY(-4%) rotate(1.5deg); }
  }

  .plus-un {
    position: fixed;
    z-index: 4;
    font-family: var(--titre);
    font-size: 16px;
    color: var(--or);
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    animation: monte .9s ease-out forwards;
  }
  @keyframes monte {
    to { transform: translateY(-70px); opacity: 0; }
  }

  /* ── Contenu central ── */
  .contenu {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.4vh, 26px);
    padding: 24px 16px 64px;
    text-align: center;
    pointer-events: none; /* les clics traversent jusqu'aux personnages */
  }
  .contenu > * { opacity: 0; }
  .contenu p { text-shadow: 2px 2px 0 #000, 0 0 8px #000, 0 0 16px #000; }
  body.ouvert .contenu > * { animation: apparait .8s cubic-bezier(.2, .8, .2, 1) forwards; }
  body.ouvert .contenu > :nth-child(1) { animation-delay: .2s; }
  body.ouvert .contenu > :nth-child(2) { animation-delay: .4s; }
  body.ouvert .contenu > :nth-child(3) { animation-delay: 1.3s; }
  body.ouvert .contenu > :nth-child(4) { animation-delay: 1.6s; }
  body.ouvert .contenu > :nth-child(5) { animation-delay: 1.9s; }
  body.ouvert .contenu > :nth-child(6) { animation-delay: 2.2s; }
  @keyframes apparait {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  .surtitre {
    margin: 0;
    color: var(--foret);
    font-size: clamp(20px, 3.2vw, 30px);
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: var(--titre);
    font-weight: 400;
    font-size: clamp(30px, 8.5vw, 104px);
    line-height: 1.15;
    color: var(--or);
    text-shadow:
      0 .06em 0 #8a4b12,
      0 .12em 0 #3a1c08,
      0 0 .5em rgba(242, 182, 50, .45);
  }
  h1 .lettre {
    display: inline-block;
    opacity: 0;
    white-space: pre;
  }
  body.ouvert h1 .lettre {
    animation:
      tombe .5s cubic-bezier(.3, 1.6, .5, 1) forwards,
      flotte 3s ease-in-out infinite;
    animation-delay: calc(.5s + var(--i) * 70ms), calc(1.2s + var(--i) * 120ms);
  }
  @keyframes tombe {
    from { opacity: 0; transform: translateY(-.8em) scale(1.4); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes flotte {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -.06em; }
  }

  .sous-titre {
    margin: 0;
    font-size: clamp(22px, 3.4vw, 34px);
    color: var(--parchemin);
  }

  .compte {
    display: flex;
    gap: clamp(8px, 2vw, 20px);
  }
  .compte div {
    min-width: clamp(62px, 15vw, 110px);
    padding: 12px 6px 8px;
    background: rgba(11, 10, 20, .72);
    border: 3px solid var(--or);
    box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0, 0, 0, .5);
  }
  .compte b {
    display: block;
    font-family: var(--titre);
    font-weight: 400;
    font-size: clamp(18px, 4.2vw, 38px);
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .compte span {
    font-size: clamp(16px, 2.2vw, 22px);
    color: var(--discret);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .compte.fini {
    font-family: var(--titre);
    font-size: clamp(16px, 3.5vw, 30px);
    color: var(--braise);
  }

  /* ── La grande question ── */
  .question {
    margin: 0;
    max-width: 22em;
    font-family: var(--titre);
    font-size: clamp(15px, 3.3vw, 34px);
    line-height: 1.6;
    color: var(--braise);
  }
  .question span {
    display: inline-block;
    animation: rage 2.4s ease-in-out infinite;
  }
  @keyframes rage {
    0%, 70%, 100% { transform: none; }
    74% { transform: translateX(-4px) rotate(-1.5deg); }
    78% { transform: translateX(4px) rotate(1.5deg); }
    82% { transform: translateX(-3px) rotate(-1deg); }
    86% { transform: translateX(3px) scale(1.04); }
  }

  .infos {
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    line-height: 1.25;
  }
  .infos strong { color: var(--or); font-weight: 400; }

  .message {
    margin: 0;
    max-width: 34em;
    color: var(--discret);
    font-size: clamp(20px, 2.6vw, 26px);
    line-height: 1.2;
  }

  /* ── Barre du bas et bouton son ── */
  .bas {
    position: fixed;
    left: 0; right: 0; bottom: 14px;
    z-index: 3;
    text-align: center;
    font-size: 20px;
    color: var(--discret);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s 3s;
  }
  body.ouvert .bas { opacity: 1; }
  .bas b { color: var(--or); font-weight: 400; }

  button {
    font-family: var(--titre);
    cursor: pointer;
    color: var(--nuit);
    background: var(--or);
    border: 0;
    box-shadow: 0 0 0 3px #000, 0 6px 0 3px #8a4b12;
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  button:hover { background: #ffd062; }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 3px #000, 0 2px 0 3px #8a4b12; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }

  #son {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 3;
    padding: 10px 12px;
    font-size: 11px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .6s 1s;
  }
  body.ouvert #son { opacity: 1; visibility: visible; }
  #son.coupe { background: var(--discret); }

  /* ── Écran d'accueil ── */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 16px;
    text-align: center;
    background: radial-gradient(ellipse at center, var(--nuit-2), #05040a 75%);
    transition: opacity .9s, visibility .9s;
  }
  body.ouvert #intro { opacity: 0; visibility: hidden; }
  #intro p {
    margin: 0;
    font-size: clamp(24px, 4vw, 34px);
    animation: clignote 1.6s steps(2) infinite;
  }
  @keyframes clignote { 50% { opacity: .35; } }
  #entrer {
    padding: 20px 26px;
    font-size: clamp(13px, 2.6vw, 20px);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 3px #000, 0 6px 0 3px #8a4b12, 0 0 34px 8px rgba(242, 182, 50, .55); }
  }
  #intro small { color: var(--discret); font-size: 20px; }

  @media (prefers-reduced-motion: reduce) {
    h1 .lettre, #intro p, #entrer { animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<canvas id="fond" aria-hidden="true"></canvas>
<div id="scene" aria-hidden="true"></div>

<main class="contenu">
  <p class="surtitre" id="surtitre"></p>
  <h1 id="titre"></h1>
  <p class="sous-titre" id="sous-titre"></p>
  <div class="compte" id="compte" role="timer">
    <div><b id="c-j">--</b><span>jours</span></div>
    <div><b id="c-h">--</b><span>heures</span></div>
    <div><b id="c-m">--</b><span>min</span></div>
    <div><b id="c-s">--</b><span>sec</span></div>
  </div>
  <p class="question" id="bloc-question"><span id="question"></span></p>
  <p class="infos" id="infos"><strong id="date"></strong><br><span id="lieu"></span></p>
  <p class="message" id="message"></p>
</main>

<div class="bas">Clique sur les héros qui passent — salués : <b id="score">0</b></div>
<button id="son" type="button" aria-pressed="true">♪ SON</button>

<div id="intro">
  <p>Un message t'attend…</p>
  <button id="entrer" type="button">▶ OUVRIR L'INVITATION</button>
  <small>avec le son, c'est mieux</small>
</div>

<script src="config.js"></script>
<script>
(() => {
  const C = window.CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const hasard = (min, max) => min + Math.random() * (max - min);

  // ───────── Textes ─────────
  document.title = C.titre || "Invitation";
  $("surtitre").textContent = C.surtitre || "";
  $("sous-titre").textContent = C.sousTitre || "";
  $("lieu").textContent = C.lieu || "";
  $("message").textContent = [C.message, C.signature].filter(Boolean).join(" — ");

  const titre = $("titre");
  titre.setAttribute("aria-label", C.titre || "");
  [...(C.titre || "")].forEach((lettre, i) => {
    const s = document.createElement("span");
    s.className = "lettre";
    s.style.setProperty("--i", i);
    s.textContent = lettre;
    s.setAttribute("aria-hidden", "true");
    titre.appendChild(s);
  });

  // ───────── La grande question (mode "question") ─────────
  const modeQuestion = C.mode !== "compte";
  if (modeQuestion) {
    $("compte").remove();
    $("infos").remove();
    $("question").textContent = C.question || "";
  } else {
    $("bloc-question").remove();
  }

  // ───────── Date et compte à rebours (mode "compte") ─────────
  const cible = new Date(C.date);
  if (modeQuestion) {
    // rien à afficher : la date n'est pas encore choisie
  } else if (!isNaN(cible)) {
    const jour = cible.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const heure = cible.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }).replace(":", "h");
    $("date").textContent = `${jour} · ${heure}`;
    const deux = (n) => String(n).padStart(2, "0");
    const tic = () => {
      const reste = cible - Date.now();
      if (reste <= 0) {
        const bloc = $("compte");
        bloc.className = "compte fini";
        bloc.textContent = "C'EST PARTI !";
        clearInterval(horloge);
        return;
      }
      const s = Math.floor(reste / 1000);
      $("c-j").textContent = deux(Math.floor(s / 86400));
      $("c-h").textContent = deux(Math.floor(s / 3600) % 24);
      $("c-m").textContent = deux(Math.floor(s / 60) % 60);
      $("c-s").textContent = deux(s % 60);
    };
    const horloge = setInterval(tic, 1000);
    tic();
  } else {
    $("compte").remove();
  }

  // ───────── Fond animé : étoiles, braises, étincelles ─────────
  const toile = $("fond");
  const ctx = toile.getContext("2d");
  let L = 0, H = 0;
  const etoiles = [], braises = [], etincelles = [];

  function nouvelleBraise(partout) {
    return {
      x: hasard(0, L),
      y: partout ? hasard(0, H) : H + 10,
      vy: hasard(12, 45),
      derive: hasard(-12, 12),
      phase: hasard(0, 6.28),
      taille: Math.random() < .25 ? 4 : 2,
      teinte: hasard(18, 46),
    };
  }

  function redimensionner() {
    L = toile.width = innerWidth;
    H = toile.height = innerHeight;
    etoiles.length = 0;
    const n = Math.round((L * H) / 9000);
    for (let i = 0; i < n; i++) {
      etoiles.push({ x: hasard(0, L), y: hasard(0, H * .8), t: Math.random() < .2 ? 3 : 2, phase: hasard(0, 6.28), v: hasard(.5, 2) });
    }
    braises.length = 0;
    for (let i = 0; i < Math.round(L / 18); i++) braises.push(nouvelleBraise(true));
  }
  addEventListener("resize", redimensionner);
  redimensionner();

  function etincellesEn(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = hasard(0, 6.28), v = hasard(80, 360);
      etincelles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: hasard(.4, .9), age: 0, teinte: hasard(20, 55) });
    }
  }

  let avant = performance.now();
  function dessiner(maintenant) {
    const dt = Math.min(.05, (maintenant - avant) / 1000);
    avant = maintenant;
    const t = maintenant / 1000;
    ctx.clearRect(0, 0, L, H);

    for (const e of etoiles) {
      ctx.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(t * e.v + e.phase));
      ctx.fillStyle = "#d9d2ff";
      ctx.fillRect(e.x, e.y, e.t, e.t);
    }

    for (let i = 0; i < braises.length; i++) {
      const b = braises[i];
      b.y -= b.vy * dt;
      b.x += (b.derive + Math.sin(t * 1.5 + b.phase) * 14) * dt;
      if (b.y < -10) braises[i] = nouvelleBraise(false);
      ctx.globalAlpha = Math.max(0, Math.min(.9, b.y / H));
      ctx.fillStyle = `hsl(${b.teinte} 100% 60%)`;
      ctx.fillRect(Math.round(b.x), Math.round(b.y), b.taille, b.taille);
    }

    for (let i = etincelles.length - 1; i >= 0; i--) {
      const p = etincelles[i];
      p.age += dt;
      if (p.age >= p.vie) { etincelles.splice(i, 1); continue; }
      p.vy += 700 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.age / p.vie;
      ctx.fillStyle = `hsl(${p.teinte} 100% 62%)`;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 4, 4);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(dessiner);
  }
  requestAnimationFrame(dessiner);

  // ───────── Son : fichier du dossier music, sinon boucle 8-bit ─────────
  const volume = C.volume ?? .5;
  let sonActif = true, audioCtx = null, sortie = null, fichier = null;

  function demarrerSon() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      audioCtx = new AC();
      sortie = audioCtx.createGain();
      sortie.gain.value = volume;
      sortie.connect(audioCtx.destination);
    }
    if (!C.musique) return boucle8bit();
    fichier = new Audio("music/" + encodeURIComponent(C.musique));
    fichier.loop = true;
    fichier.volume = volume;
    fichier.play().catch(() => { fichier = null; boucle8bit(); });
  }

  function note(midi, debut, duree, type, niveau) {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = 440 * 2 ** ((midi - 69) / 12);
    g.gain.setValueAtTime(niveau, debut);
    g.gain.exponentialRampToValueAtTime(.0001, debut + duree);
    osc.connect(g).connect(sortie);
    osc.start(debut);
    osc.stop(debut + duree + .02);
  }

  function boucle8bit() {
    if (!audioCtx) return;
    const accords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // La m, Fa, Do, Sol
    const motif = [0, 1, 2, 1, 0, 2, 1, 2];
    let pas = 0;
    setInterval(() => {
      if (!sonActif || audioCtx.state !== "running") return;
      const accord = accords[Math.floor(pas / 16) % accords.length];
      const t = audioCtx.currentTime + .03;
      note(accord[motif[pas % 8]] + 12, t, .16, "square", .09);
      if (pas % 8 === 0) note(accord[0] - 12, t, .7, "triangle", .3);
      if (pas % 16 === 12) note(accord[2] + 24, t, .25, "square", .05);
      pas++;
    }, 170);
  }

  function bip() {
    if (!audioCtx || !sonActif) return;
    const t = audioCtx.currentTime;
    note(76, t, .08, "square", .12);
    note(83, t + .07, .14, "square", .12);
  }

  $("son").addEventListener("click", () => {
    sonActif = !sonActif;
    $("son").classList.toggle("coupe", !sonActif);
    $("son").setAttribute("aria-pressed", String(sonActif));
    $("son").textContent = sonActif ? "♪ SON" : "♪ MUET";
    if (fichier) sonActif ? fichier.play() : fichier.pause();
    if (sortie) sortie.gain.value = sonActif ? volume : 0;
  });

  // ───────── Personnages ─────────
  const scene = $("scene");
  const prets = [];            // images chargées
  const aLEcran = new Set();   // images visibles en ce moment : jamais deux fois la même
  let score = 0;

  (C.images || []).forEach((entree) => {
    const def = typeof entree === "string" ? { fichier: entree } : entree;
    const img = new Image();
    img.onload = () => prets.push({ ...def, img });
    img.onerror = () => console.warn(`Image introuvable dans assets : ${def.fichier}`);
    img.src = "assets/" + encodeURIComponent(def.fichier);
  });

  // Tire au hasard une image qui n'est pas déjà à l'écran
  function tirer(coucou) {
    const libres = prets.filter((p) => !aLEcran.has(p) && (p.type === "coucou") === coucou);
    return libres.length ? libres[Math.floor(Math.random() * libres.length)] : null;
  }

  function creerPersonnage(p, hauteur, sens, angleSaut) {
    const perso = document.createElement("div");
    perso.className = "perso";
    perso.style.height = hauteur + "px";
    const saut = document.createElement("span");
    saut.className = "saut";
    const img = document.createElement("img");
    img.src = p.img.src;
    img.alt = "";
    img.draggable = false;
    img.style.setProperty("--sens", sens);
    img.style.setProperty("--pas", hasard(.45, .9) + "s");
    saut.appendChild(img);
    perso.appendChild(saut);

    perso.addEventListener("pointerdown", (e) => {
      score++;
      $("score").textContent = score;
      etincellesEn(e.clientX, e.clientY);
      bip();
      saut.animate(
        [
          { transform: "none" },
          { transform: `translateY(-${hauteur * .3}px) rotate(${angleSaut}deg) scale(1.08)`, offset: .4 },
          { transform: "none" },
        ],
        { duration: 600, easing: "ease-out" }
      );
      const plus = document.createElement("div");
      plus.className = "plus-un";
      plus.textContent = "+1";
      plus.style.left = e.clientX + "px";
      plus.style.top = e.clientY - 20 + "px";
      plus.addEventListener("animationend", () => plus.remove());
      document.body.appendChild(plus);
    });
    return perso;
  }

  // Personnages qui traversent l'écran d'un bord à l'autre
  function lancerPersonnage() {
    if (document.hidden) return;
    if (scene.querySelectorAll(".perso:not(.coucou)").length >= (C.maxPersonnages || 4)) return;
    const p = tirer(false);
    if (!p) return;
    aLEcran.add(p);

    const profondeur = Math.random();                    // 0 = loin, 1 = proche
    const hauteur = Math.min(innerHeight, innerWidth) * (.2 + .25 * profondeur);
    const largeur = hauteur * (p.img.naturalWidth / p.img.naturalHeight);
    const versLaDroite = Math.random() < .5;
    // Retourne l'image pour que le personnage regarde là où il va
    const sens =
      p.regarde === "gauche" ? (versLaDroite ? -1 : 1) :
      p.regarde === "droite" ? (versLaDroite ? 1 : -1) : 1;

    // Allure tirée au hasard : normale, rapide ou très rapide (durée de la traversée)
    const allure = Math.random();
    const duree =
      allure < .5 ? hasard(12000, 18000) :
      allure < .8 ? hasard(6000, 9000) :
                    hasard(2200, 3800);

    const perso = creerPersonnage(p, hauteur, sens, versLaDroite ? 14 : -14);
    perso.style.top = hasard(0, Math.max(0, innerHeight - hauteur)) + "px";
    perso.style.zIndex = Math.round(profondeur * 100);
    perso.style.opacity = .55 + .45 * profondeur;
    scene.appendChild(perso);

    const gauche = -largeur - 20, droite = innerWidth + 20;
    perso.animate(
      [
        { transform: `translateX(${versLaDroite ? gauche : droite}px)` },
        { transform: `translateX(${versLaDroite ? droite : gauche}px)` },
      ],
      { duration: duree, easing: "linear" }
    ).onfinish = () => { perso.remove(); aLEcran.delete(p); };
  }

  // Personnages "coucou" : sortent du bas de l'écran, regardent, puis redescendent
  function faireCoucou() {
    if (document.hidden) return;
    const p = tirer(true);
    if (!p) return;
    aLEcran.add(p);

    const hauteur = Math.min(innerHeight * .42, innerWidth * .6);
    const largeur = hauteur * (p.img.naturalWidth / p.img.naturalHeight);
    const perso = creerPersonnage(p, hauteur, 1, hasard(-8, 8));
    perso.classList.add("coucou");
    perso.style.left = hasard(0, Math.max(0, innerWidth - largeur)) + "px";
    scene.appendChild(perso);

    perso.animate(
      [
        { transform: "translateY(105%)", easing: "ease-out" },
        { transform: "translateY(62%)", offset: .1 },                       // jette un œil
        { transform: "translateY(62%)", offset: .3, easing: "cubic-bezier(.2, 1.5, .4, 1)" },
        { transform: "translateY(0)", offset: .4 },                         // sort complètement
        { transform: "translateY(0)", offset: .82, easing: "ease-in" },
        { transform: "translateY(105%)" },                                  // repart en arrière
      ],
      { duration: hasard(6000, 9000) }
    ).onfinish = () => { perso.remove(); aLEcran.delete(p); };
  }

  function planifier() {
    lancerPersonnage();
    setTimeout(planifier, hasard(1800, 4500));
  }

  function planifierCoucou() {
    faireCoucou();
    setTimeout(planifierCoucou, hasard(20000, 40000));
  }

  // ───────── Ouverture ─────────
  $("entrer").addEventListener("click", () => {
    document.body.classList.add("ouvert");
    demarrerSon();
    setTimeout(planifier, 1500);
    setTimeout(planifierCoucou, 6000);
  }, { once: true });
})();
</script>
</body>
